<style>
/* VOICE: ruhig, klar, ein Werkzeug für jeden Tag – wie ein gutes Hausaufgabenheft
   IDEA: Karopapier aus dem Schulheft, Korrekturen in Rotstift
   PICTURE: die nächste Prüfung als großer Countdown oben, darunter „Heute“ zum Abhaken
   COLOUR and TYPE: Papierweiß mit grauem Karo, Rotstift als Hauptfarbe, Weinrot als Akzent; Rubik + Kalam für Handschrift-Akzente
   LAYOUT: eine Spalte, Kalenderblatt-Datum links an jeder Prüfung, aufklappbare Lernpläne */
:root{color-scheme:light dark;
 --bg:light-dark(#fafafa,#141416);--grid:light-dark(#e9e9ec,#222226);
 --ink:light-dark(#1d1d21,#ededf0);--soft:light-dark(#66666e,#a4a4ad);
 --card:light-dark(#ffffff,#1c1c20);--line:light-dark(#e2e2e6,#303036);
 --blue:light-dark(#c42238,#ee4141);--red:light-dark(#b3141c,#d8333a);--ok:light-dark(#2f7d4f,#6fd39a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;
 background-color:var(--bg);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
 background-size:22px 22px}
main{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) max(4vw,14px,env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(4vw,14px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:32px;line-height:1.05;margin:6px 0}
.upd{font-size:13px;color:var(--soft)}
.hero{margin:16px 0 22px;background:var(--blue);color:#fff;border-radius:18px;padding:20px 22px;
 display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.hero .n{font-size:clamp(64px,18vw,96px);font-weight:700;line-height:.9;grid-row:span 3}
.hero .unit{font-family:Kalam,cursive;font-size:20px;opacity:.9}
.hero .what{font-size:22px;font-weight:700;line-height:1.15}
.hero .when{font-size:15px;opacity:.9}
.hero.today .n{color:#ffe3a3}
h2{font-size:20px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:400;font-size:14px;color:var(--soft)}
.today{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--blue);border-radius:6px;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--card)}
.task input:checked{background:var(--blue)}
.task input:checked::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.task input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.task label{cursor:pointer}
.task.done label{text-decoration:line-through;color:var(--soft)}
.tag{display:inline-block;font-size:13px;font-weight:500;color:var(--blue);margin-right:6px}
.min{font-size:13px;color:var(--soft);white-space:nowrap}
.empty{color:var(--soft);padding:12px 0;font-family:Kalam,cursive;font-size:18px}
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.exam>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;cursor:pointer;min-height:64px}
.exam>button:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
.cal{border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--bg)}
.cal b{display:block;background:var(--red);color:#fff;font-size:12px;font-weight:500;padding:1px 0}
.cal span{display:block;font-size:24px;font-weight:700;line-height:1.3}
.subj{font-weight:700;font-size:17px;line-height:1.2}
.meta{font-size:13px;color:var(--soft)}
.pill{font-size:13px;font-weight:500;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--bg);border:1px solid var(--line)}
.pill.hot{background:var(--red);border-color:var(--red);color:#fff}
.pill.warm{border-color:var(--red);color:var(--red)}
.body{display:none;padding:0 16px 16px;border-top:1px dashed var(--line)}
.exam.open .body{display:block}
.body h3{font-size:15px;margin:14px 0 6px}
.topics{margin:0;padding-left:20px}
.topics li{margin:2px 0}
.day{margin-top:10px}
.day .d{font-family:Kalam,cursive;font-size:18px;color:var(--red)}
.day.past{opacity:.55}
.note{font-size:14px;color:var(--soft);font-family:Kalam,cursive;font-size:17px}
.src{font-size:13px;color:var(--soft);margin-top:12px}
a{color:var(--blue)}
details summary{cursor:pointer;color:var(--soft);font-size:14px;padding:8px 0}
@media(prefers-reduced-motion:no-preference){.exam.open .body{animation:drop .18s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-4px)}}}
</style>
</head>

<script>
{
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const now = new Date(); const todayIso = iso(now); const today = parse(todayIso);
const days = s => Math.round((parse(s) - today) / 864e5);
const nice = s => { const d = parse(s); return WD[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store = {};
try { store = JSON.parse(localStorage.getItem('pruef-done') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('pruef-done', JSON.stringify(store)); } catch (e) {} };
const key = (ex, day, i) => ex.id + '|' + day.date + '|' + i;
const countdown = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : 'in ' + n + ' Tagen';

const upcoming = DATA.exams.filter(e => days(e.date) >= 0).sort((a,b) => a.date.localeCompare(b.date));
const past = DATA.exams.filter(e => days(e.date) < 0).sort((a,b) => b.date.localeCompare(a.date));

const u = new Date(DATA.updated);
document.getElementById('upd').textContent = 'Stand: ' + u.getDate() + '. ' + MON[u.getMonth()] + ', ' + pad(u.getHours()) + ':' + pad(u.getMinutes()) + ' Uhr';
document.getElementById('todayDate').textContent = nice(todayIso);

const hero = document.getElementById('hero');
if (upcoming.length) {
  const e = upcoming[0], n = days(e.date);
  hero.innerHTML = '<div class="hero' + (n === 0 ? ' today' : '') + '"><div class="n">' + (n === 0 ? '!' : n) + '</div>' +
    '<div class="unit">' + (n === 0 ? 'heute ist es so weit' : n === 1 ? 'Tag noch bis' : 'Tage noch bis') + '</div>' +
    '<div class="what">' + esc(e.subject) + ' · ' + esc(e.type) + '</div><div class="when">' + nice(e.date) + '</div></div>';
} else hero.innerHTML = '<p class="empty">Keine Prüfungen eingetragen.</p>';

const taskRow = (ex, day, t, i, withTag) => {
  const k = key(ex, day, i), done = !!store[k], id = 'c' + btoa(unescape(encodeURIComponent(k))).replace(/[^a-z0-9]/gi,'');
  return '<div class="task' + (done ? ' done' : '') + '"><input type="checkbox" id="' + id + '" data-k="' + esc(k) + '"' + (done ? ' checked' : '') + '>' +
    '<label for="' + id + '">' + (withTag ? '<span class="tag">' + esc(ex.subject) + '</span>' : '') + esc(t.t) + ' <span class="min">· ' + t.m + ' min</span></label></div>';
};

const todayEl = document.getElementById('today');
const todays = [];
upcoming.forEach(ex => (ex.plan || []).forEach(day => { if (day.date === todayIso) day.tasks.forEach((t,i) => todays.push(taskRow(ex, day, t, i, true))); }));
todayEl.innerHTML = todays.length ? todays.join('') : '<p class="empty">Heute steht nichts im Plan. Frei!</p>';

const card = (ex, open) => {
  const n = days(ex.date), d = parse(ex.date);
  const cls = n < 0 ? '' : n <= 3 ? ' hot' : n <= 10 ? ' warm' : '';
  const plan = (ex.plan || []).map(day => '<div class="day' + (days(day.date) < 0 ? ' past' : '') + '"><div class="d">' + nice(day.date) + '</div>' +
    day.tasks.map((t,i) => taskRow(ex, day, t, i, false)).join('') + '</div>').join('');
  return '<div class="exam' + (open ? ' open' : '') + '"><button aria-expanded="' + open + '">' +
    '<div class="cal"><b>' + MON[d.getMonth()] + '</b><span>' + d.getDate() + '</span></div>' +
    '<div><div class="subj">' + esc(ex.subject) + '</div><div class="meta">' + esc(ex.type) + ' · ' + WD[d.getDay()] + ' · ' + esc(ex.teacher) + '</div></div>' +
    '<span class="pill' + cls + '">' + (n < 0 ? 'vorbei' : countdown(n)) + '</span></button><div class="body">' +
    (ex.topics && ex.topics.length ? '<h3>Stoff</h3><ul class="topics">' + ex.topics.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
    (plan ? '<h3>Lernplan</h3>' + plan : '') +
    (ex.note ? '<p class="note">' + esc(ex.note) + '</p>' : '') +
    (ex.link ? '<p><a href="' + esc(ex.link) + '" target="_blank" rel="noopener">' + esc(ex.linkText || 'Lernmaterial öffnen') + '</a></p>' : '') +
    (ex.source ? '<p class="src">Quelle: ' + esc(ex.source) + '</p>' : '') + '</div></div>';
};
document.getElementById('list').innerHTML = upcoming.map((e,i) => card(e, i === 0)).join('') || '<p class="empty">Nichts geplant.</p>';
document.getElementById('past').innerHTML = past.map(e => card(e, false)).join('');
if (!past.length) document.getElementById('pastWrap').hidden = true;

document.addEventListener('click', ev => {
  const b = ev.target.closest('.exam>button');
  if (b) { const c = b.parentElement; c.classList.toggle('open'); b.setAttribute('aria-expanded', c.classList.contains('open')); }
});
document.addEventListener('change', ev => {
  const c = ev.target; if (!c.dataset || !c.dataset.k) return;
  if (c.checked) store[c.dataset.k] = 1; else delete store[c.dataset.k];
  save();
  document.querySelectorAll('input[data-k]').forEach(x => { if (x.dataset.k === c.dataset.k) { x.checked = c.checked; x.closest('.task').classList.toggle('done', c.checked); } });
});
}
</script>
</body>
