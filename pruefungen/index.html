:root{color-scheme:light dark;

*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;

.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}

.sheet h3{margin:0;font-size:18px}

.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;min-height:48px;cursor:pointer}
.opt.right{border-color:var(--ok,#2f7d4f);background:color-mix(in srgb,var(--ok,#2f7d4f) 14%,var(--card))}

.why{font-size:15px;margin:10px 0 4px}.why small{display:block;color:var(--soft);font-size:13px;margin-top:4px}
.flash{background:var(--card);border:1.5px solid var(--line);border-radius:16px;min-height:200px;padding:22px;display:grid;place-content:center;text-align:center;font-size:20px;font-weight:500;cursor:pointer}
.flash.back{font-size:17px;font-weight:400}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.res{font-size:56px;font-weight:700;color:var(--blue);margin:10px 0 0}
.tip{font-size:14px;color:var(--soft);margin-top:10px}
details summary{cursor:pointer;color:var(--soft);font-size:14px;padding:8px 0}
@media(prefers-reduced-motion:no-preference){.exam.open .body{animation:drop .18s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-4px)}}}

. Atombau und gekürztes PSE"}, {"f": "Isotope", "b": "Atome eines Elements, die sich in der Zahl der Neutronen unterscheiden.", "src": "I. Atombau und gekürztes PSE"}, {"f": "Nukleonen", "b": "Kernteilchen: Protonen und Neutronen. m(Neutron) ≈ m(Proton) ≈ 1 u.", "src": "I. Atombau und gekürztes PSE"}, {"f": "Radioaktivität", "b": "Spontaner Zerfall instabiler Atomkerne, der zur Freisetzung radioaktiver Strahlung führt.", "src": "I. Atombau und gekürztes PSE"}, {"f": "Halbwertszeit", "b": "Zeitraum, in dem die Hälfte der noch vorhandenen radioaktiven Isotope zerfallen ist.", "src": "I. Atombau und gekürztes PSE"}, {"f": "Flammenfärbung: Versuchsaufbau", "b": "Verschiedene Salze werden mit einem ausgeglühten Magnesiastäbchen in die rauschende Flamme des Brenners gehalten.", "src": "Das Energiestufenmodell"}, {"f": "Flammenfärbung: Erklärung", "b": "Elektronen werden durch Energiezufuhr in ein erhöhtes Energieniveau angehoben (angeregter Zustand). Beim Zurückfallen emittieren sie Licht einer bestimmten Wellenlänge.", "src": "Das Energiestufenmodell"}, {"f": "Energiestufenmodell", "b": "Elektronen sind bestimmten Energiestufen zugeordnet, die sich in ihrer Energie unterscheiden.", "src": "Das Energiestufenmodell"}, {"f": "Ionisierungsenergie", "b": "Die benötigte Energie, um ein Elektron aus der Hülle eines Atoms zu entfernen.", "src": "Ionisierungsenergie (IE)"}, {"f": "Höhere Energiestufe → IE?", "b": "Relativ kleine IE. Niedrigere Stufen: geringerer Abstand → stärkere Anziehung → höhere IE.", "src": "Ionisierungsenergie (IE)"}, {"f": "Besetzungsregel", "b": "Eine Energiestufe n kann maximal 2n² Elektronen aufnehmen.", "src": "Ionisierungsenergie (IE)"}, {"f": "Elektronenkonfiguration", "b": "Gibt die Verteilung der Elektronen auf die verschiedenen Energiestufen der Atomhülle an, z. B. Al 1² 2⁸ 3³.", "src": "3. Die Elektronenkonfiguration"}, {"f": "Gruppe im PSE", "b": "Elemente mit ähnlichen Eigenschaften stehen untereinander; gleiche Anzahl an Valenzelektronen.", "src": "Erstelle die Energiestufendiagramme …"}, {"f": "Edelgasregel", "b": "Atome der Hauptgruppen streben die Edelgaskonfiguration des im PSE nächstgelegenen Edelgasatoms an (veraltet: Oktettregel; Helium: Duplett).", "src": "5. Die Edelgasregel"}, {"f": "Ionenladung HG V–VII", "b": "−8 + Hauptgruppennummer (Edelgas der eigenen Periode wird nachgeahmt).", "src": "5. Die Edelgasregel"}, {"f": "Halogene als Elemente", "b": "F₂, Cl₂, Br₂, I₂ – elementar nur als zweiatomige Moleküle, in der Natur meist als Anionen in Salzen.", "src": "4. Ausgewählte Hauptgruppen"}, {"f": "Nachweis von Halogenid-Ionen", "b": "Fällung mit Silbernitrat.", "src": "4. Ausgewählte Hauptgruppen"}, {"f": "Edelgaskonfiguration", "b": "Elektronenkonfiguration der 8. Hauptgruppe; energetisch günstig und besonders stabil.", "src": "4. Ausgewählte Hauptgruppen"}, {"f": "Elektrolyse", "b": "Endotherme Reaktion, bei der eine chemische Reaktion mit Hilfe von elektrischem Strom erzwungen wird.", "src": "II. Elektronenübergänge – 1. Elektrolyse"}, {"f": "Bleichlorid: Redox", "b": "Red: Pb²⁺ + 2 e⁻ → Pb. Ox: 2 Cl⁻ → Cl₂ + 2 e⁻. Redox: Pb²⁺ + 2 Cl⁻ → Pb + Cl₂.", "src": "Übungen für die Schulaufgabe"}, {"f": "Salzbildung", "b": "Bei der Reaktion eines Metalls mit einem Nichtmetall kommt es zu einer Elektronenübertragung: Das Metall gibt Elektronen ab (Kationen), das Nichtmetall nimmt sie auf (Anionen).", "src": "Verbesserung 1. kleiner schriftlicher Leistungsnachweis"}]}, {"id": "phy-2026-12-01", "subject": "Physik", "type": "Schulaufgabe", "teacher": "Sp", "date": "2026-12-01", "source": "OneNote Ph.Sp.9d.26-27 (wird eingelesen)", "topics": [], "plan": [{"date": "2026-11-25", "tasks": [{"t": "Stoff sammeln: Hefteinträge seit der letzten Physik-Prüfung im OneNote-Notizbuch durchblättern, Themenliste machen", "m": 30}]}, {"date": "2026-11-26", "tasks": [{"t": "Erste Hälfte der Themen: Hefteinträge lernen, Formeln mit Einheiten aufschreiben", "m": 40}]}, {"date": "2026-11-27", "tasks": [{"t": "Zweite Hälfte der Themen lernen", "m": 40}]}, {"date": "2026-11-29", "tasks": [{"t": "Übungsaufgaben aus Heft und Buch rechnen", "m": 45}]}, {"date": "2026-11-30", "tasks": [{"t": "Fehler aus den Übungen wiederholen, Formelblatt einmal auswendig aufschreiben", "m": 30}]}], "note": "Die genauen Themen trage ich beim nächsten Update aus deinem Physik-Notizbuch ein."}, {"id": "eng-2026-12-03", "subject": "Englisch", "type": "Schulaufgabe", "teacher": "Fm", "date": "2026-12-03", "source": "OneNote E.Fm.9d.26-27 (wird eingelesen)", "topics": [], "plan": [{"date": "2026-11-25", "tasks": [{"t": "Vokabeln der aktuellen Unit, Teil 1", "m": 15}]}, {"date": "2026-11-27", "tasks": [{"t": "Vokabeln Teil 2 und Grammatik der Unit wiederholen", "m": 30}]}, {"date": "2026-11-29", "tasks": [{"t": "Einen Schreibauftrag üben (Text unter Zeitdruck schreiben)", "m": 30}]}, {"date": "2026-12-02", "tasks": [{"t": "Alle Vokabeln abfragen lassen, Grammatik-Übungen kontrollieren", "m": 30}]}], "note": "Am 1.12. ist Physik plus Juniorband und Adventskonzert, darum ist dieser Tag frei."}, {"id": "inf-2026-12-21", "subject": "Informatik", "type": "Kurzarbeit", "teacher": "Wo", "date": "2026-12-21", "source": "OneNote Inf.Wo.9d (wird eingelesen)", "topics": [], "plan": [{"date": "2026-12-16", "tasks": [{"t": "Stoff seit Schuljahresbeginn aus dem Notizbuch sammeln", "m": 30}]}, {"date": "2026-12-18", "tasks": [{"t": "Aufgaben aus dem Unterricht nochmal selbst lösen", "m": 40}]}, {"date": "2026-12-20", "tasks": [{"t": "Fehler wiederholen, Begriffe erklären können", "m": 25}]}], "note": ""}, {"id": "deu-2027-02-18", "subject": "Deutsch", "type": "Schulaufgabe", "teacher": "Kl", "date": "2027-02-18", "topics": [], "plan": [], "note": "Lernplan kommt etwa drei Wochen vorher. Die Faschingsferien liegen davor (8.–12.2.)."}, {"id": "mat-2027-02-25", "subject": "Mathematik", "type": "Schulaufgabe", "teacher": "Gr", "date": "2027-02-25", "topics": [], "plan": [], "note": "Lernplan kommt etwa drei Wochen vorher."}, {"id": "lat-2027-03-05", "subject": "Latein", "type": "Schulaufgabe", "teacher": "Kö", "date": "2027-03-05", "topics": [], "plan": [], "note": "Lernplan kommt etwa drei Wochen vorher."}, {"id": "eng-2027-03-17", "subject": "Englisch", "type": "Mündliche Schulaufgabe", "teacher": "Fm", "date": "2027-03-17", "topics": [], "plan": [], "note": "Lernplan kommt etwa drei Wochen vorher."}]}

<script>
{
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const MON = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const now = new Date(); const todayIso = iso(now); const today = parse(todayIso);
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const days = s => Math.round((parse(s) - today) / 864e5);
const nice = s => { const d = parse(s); return WD[d.getDay()]+', '+d.getDate()+'. '+MON[d.getMonth()]; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store = {};
try { store = JSON.parse(localStorage.getItem('pruef-done') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('pruef-done', JSON.stringify(store)); } catch (e) {} };
const key = (ex, day, i) => ex.id + '|' + day.date + '|' + i;
const countdown = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : 'in ' + n + ' Tagen';


/* ---------- Üben: Quiz und Karteikarten ---------- */
const modal = document.getElementById('modal');
let best = {}, boxes = {};
try { best = JSON.parse(localStorage.getItem('pruef-best') || '{}'); boxes = JSON.parse(localStorage.getItem('pruef-boxes') || '{}'); } catch (e) {}
const saveP = () => { try { localStorage.setItem('pruef-best', JSON.stringify(best)); localStorage.setItem('pruef-boxes', JSON.stringify(boxes)); } catch (e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const findEx = id => DATA.exams.find(e => e.id === id);
const close = () => { modal.hidden = true; modal.innerHTML = ''; document.body.style.overflow = ''; };
const open = html => { modal.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; modal.hidden = false; document.body.style.overflow = 'hidden'; };
const markDone = k => {
  if (!k) return;
  store[k] = 1; save();
  document.querySelectorAll('input[data-k]').forEach(x => { if (x.dataset.k === k) { x.checked = true; x.closest('.task').classList.add('done'); } });
};
const PASS = 0.8;

function startQuiz(id, taskKey) {
  const ex = findEx(id); if (!ex || !ex.quiz || !ex.quiz.length) return;
  const qs = shuffle(ex.quiz).slice(0, Math.min(10, ex.quiz.length)).map(q => { const order = shuffle(q.o.map((_, i) => i)); return { ...q, order }; });
  let i = 0, right = 0;
  const show = () => {
    const q = qs[i];
    open('<div class="top"><h3>Quiz ' + esc(ex.subject) + ' · ' + (i + 1) + '/' + qs.length + '</h3><button class="x" data-close aria-label="Schließen">×</button></div>' +
      '<div class="prog"><i style="width:' + (i / qs.length * 100) + '%"></i></div><p class="qq">' + esc(q.q) + '</p>' +
      q.order.map(o => '<button class="opt" data-o="' + o + '">' + esc(q.o[o]) + '</button>').join('') + '<div id="fb"></div>');
  };
  const finish = () => {
    const pct = Math.round(right / qs.length * 100), ok = right / qs.length >= PASS;
    best[id] = Math.max(best[id] || 0, pct); saveP();
    if (ok) markDone(taskKey);
    open('<div class="top"><h3>Quiz ' + esc(ex.subject) + '</h3><button class="x" data-close aria-label="Schließen">×</button></div>' +
      '<p class="res">' + pct + ' %</p><p>' + right + ' von ' + qs.length + ' richtig. ' + (ok ? 'Geschafft! ' + (taskKey ? 'Die Aufgabe ist abgehakt.' : '') : 'Für 80 % fehlen noch ' + (Math.ceil(qs.length * PASS) - right) + ' Antworten. Schau dir die falschen nochmal an und versuch es später erneut.') + '</p>' +
      '<div class="row"><button class="btn" data-close>Fertig</button><button class="btn main" data-again>Nochmal</button></div>' +
      '<p class="tip">Sich selbst abfragen bringt mehr als nur durchlesen – besonders, wenn du es über mehrere Tage verteilt wiederholst.</p>');
    modal.querySelector('[data-again]').onclick = () => startQuiz(id, taskKey);
  };
  modal.onclick = ev => {
    if (ev.target === modal || ev.target.closest('[data-close]')) return close();
    const b = ev.target.closest('.opt'); if (!b || b.disabled) return;
    const q = qs[i], pick = +b.dataset.o, good = pick === q.a;
    if (good) right++;
    modal.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.o === q.a) x.classList.add('right'); });
    if (!good) b.classList.add('wrong');
    document.getElementById('fb').innerHTML = '<p class="why"><b>' + (good ? 'Richtig.' : 'Nicht ganz.') + '</b> ' + esc(q.why) + '<small>Quelle: ' + esc(q.src) + '</small></p><div class="row"><button class="btn main" data-next>' + (i + 1 < qs.length ? 'Weiter' : 'Auswertung') + '</button></div>';
    modal.querySelector('[data-next]').onclick = ev2 => { ev2.stopPropagation(); i++; i < qs.length ? show() : finish(); };
  };
  show();
}

/* Karteikarten mit drei Fächern: Fach 1 jedes Mal, Fach 2 alle 2 Tage, Fach 3 alle 4 Tage */
function startCards(id, taskKey) {
  const ex = findEx(id); if (!ex || !ex.cards || !ex.cards.length) return;
  const gap = [0, 0, 2, 4], b = boxes[id] = boxes[id] || {};
  const due = ex.cards.map((c, n) => ({ c, n })).filter(({ n }) => { const s = b[n]; return !s || days(s.next) <= 0; });
  const deck = shuffle(due.length ? due : ex.cards.map((c, n) => ({ c, n })));
  let i = 0, known = 0, flipped = false;
  const show = () => {
    const { c } = deck[i];
    open('<div class="top"><h3>Karteikarten ' + esc(ex.subject) + ' · ' + (i + 1) + '/' + deck.length + '</h3><button class="x" data-close aria-label="Schließen">×</button></div>' +
      '<div class="prog"><i style="width:' + (i / deck.length * 100) + '%"></i></div>' +
      '<div class="flash' + (flipped ? ' back' : '') + '" data-flip>' + esc(flipped ? c.b : c.f) + (flipped ? '<small class="tip">Quelle: ' + esc(c.src) + '</small>' : '<small class="tip">Antippen zum Umdrehen</small>') + '</div>' +
      (flipped ? '<div class="row"><button class="btn" data-no>Nochmal</button><button class="btn main" data-yes>Gewusst</button></div>' : ''));
  };
  const finish = () => {
    const pct = Math.round(known / deck.length * 100), ok = known / deck.length >= PASS;
    saveP(); if (ok) markDone(taskKey);
    open('<div class="top"><h3>Karteikarten ' + esc(ex.subject) + '</h3><button class="x" data-close aria-label="Schließen">×</button></div>' +
      '<p class="res">' + pct + ' %</p><p>' + known + ' von ' + deck.length + ' Karten gewusst. ' + (ok ? 'Stark! ' + (taskKey ? 'Die Aufgabe ist abgehakt.' : '') : 'Die nicht gewussten Karten kommen beim nächsten Mal wieder dran.') + '</p>' +
      '<div class="row"><button class="btn main" data-close>Fertig</button></div><p class="tip">Gewusste Karten kommen erst nach ein paar Tagen wieder – so wiederholst du mit Abstand.</p>');
  };
  modal.onclick = ev => {
    if (ev.target === modal || ev.target.closest('[data-close]')) return close();
    if (ev.target.closest('[data-flip]') && !flipped) { flipped = true; return show(); }
    const yes = ev.target.closest('[data-yes]'), no = ev.target.closest('[data-no]');
    if (!yes && !no) return;
    const n = deck[i].n, s = b[n] || { box: 1 };
    s.box = yes ? Math.min(3, s.box + 1) : 1; s.next = add(todayIso, gap[s.box]); b[n] = s;
    if (yes) known++;
    i++; flipped = false; i < deck.length ? show() : finish();
  };
  show();
}
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !modal.hidden) close(); });

const upcoming = DATA.exams.filter(e => days(e.date) >= 0).sort((a,b) => a.date.localeCompare(b.date));
const past = DATA.exams.filter(e => days(e.date) < 0).sort((a,b) => b.date.localeCompare(a.date));

const u = new Date(DATA.updated);
document.getElementById('upd').textContent = 'Stand: ' + u.getDate() + '. ' + MON[u.getMonth()] + ', ' + pad(u.getHours()) + ':' + pad(u.getMinutes()) + ' Uhr';
document.getElementById('todayDate').textContent = nice(todayIso);

const hero = document.getElementById('hero');
if (upcoming.length) {
  const e = upcoming[0], n = days(e.date);
  hero.innerHTML = '<div class="hero' + (n === 0 ? ' today' : '') + '"><div class="n">' + (n === 0 ? '!' : n) + '</div>' +
    '<div class="unit">' + (n === 0 ? 'heute ist es so weit' : n === 1 ? 'Tag noch bis' : 'Tage noch bis') + '</div>' +
    '<div class="what">' + esc(e.subject) + ' · ' + esc(e.type) + '</div><div class="when">' + nice(e.date) + '</div></div>';
} else hero.innerHTML = '<p class="empty">Keine Prüfungen eingetragen.</p>';

const taskRow = (ex, day, t, i, withTag) => {
  const k = key(ex, day, i), done = !!store[k], id = 'c' + btoa(unescape(encodeURIComponent(k))).replace(/[^a-z0-9]/gi,'');
  return '<div class="task' + (done ? ' done' : '') + '"><input type="checkbox" id="' + id + '" data-k="' + esc(k) + '"' + (done ? ' checked' : '') + '>' +
    '<label for="' + id + '">' + (withTag ? '<span class="tag">' + esc(ex.subject) + '</span>' : '') + esc(t.t) + ' <span class="min">· ' + t.m + ' min</span></label>' + (t.quiz || t.cards ? '<button class="go" data-' + (t.quiz ? 'quiz' : 'cards') + '="' + esc(ex.id) + '" data-tk="' + esc(k) + '">Starten</button>' : '') + '</div>';
};

const todayEl = document.getElementById('today');
const todays = [];
upcoming.forEach(ex => (ex.plan || []).forEach(day => { if (day.date === todayIso) day.tasks.forEach((t,i) => todays.push(taskRow(ex, day, t, i, true))); }));
todayEl.innerHTML = todays.length ? todays.join('') : '<p class="empty">Heute steht nichts im Plan. Frei!</p>';

const card = (ex, open) => {
  const n = days(ex.date), d = parse(ex.date);
  const cls = n < 0 ? '' : n <= 3 ? ' hot' : n <= 10 ? ' warm' : '';
  const plan = (ex.plan || []).map(day => '<div class="day' + (days(day.date) < 0 ? ' past' : '') + '"><div class="d">' + nice(day.date) + '</div>' +
    day.tasks.map((t,i) => taskRow(ex, day, t, i, false)).join('') + '</div>').join('');
  return '<div class="exam' + (open ? ' open' : '') + '"><button aria-expanded="' + open + '">' +
    '<div class="cal"><b>' + MON[d.getMonth()] + '</b><span>' + d.getDate() + '</span></div>' +
    '<div><div class="subj">' + esc(ex.subject) + '</div><div class="meta">' + esc(ex.type) + ' · ' + WD[d.getDay()] + ' · ' + esc(ex.teacher) + '</div></div>' +
    '<span class="pill' + cls + '">' + (n < 0 ? 'vorbei' : countdown(n)) + '</span></button><div class="body">' +
    (ex.topics && ex.topics.length ? '<h3>Stoff</h3><ul class="topics">' + ex.topics.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' : '') +
    (plan ? '<h3>Lernplan</h3>' + plan : '') +
    ((ex.quiz && ex.quiz.length) || (ex.cards && ex.cards.length) ? '<div class="prac">' + (ex.quiz && ex.quiz.length ? '<button class="btn" data-quiz="' + esc(ex.id) + '">Quiz (' + Math.min(10, ex.quiz.length) + ' Fragen)</button>' : '') + (ex.cards && ex.cards.length ? '<button class="btn" data-cards="' + esc(ex.id) + '">Karteikarten (' + ex.cards.length + ')</button>' : '') + '</div>' + (best[ex.id] != null ? '<p class="best">Bestes Quiz-Ergebnis: ' + best[ex.id] + ' %</p>' : '') : '') +
    (ex.note ? '<p class="note">' + esc(ex.note) + '</p>' : '') +
    (ex.link ? '<p><a href="' + esc(ex.link) + '" target="_blank" rel="noopener">' + esc(ex.linkText || 'Lernmaterial öffnen') + '</a></p>' : '') +
    (ex.source ? '<p class="src">Quelle: ' + esc(ex.source) + '</p>' : '') + '</div></div>';
};
document.getElementById('list').innerHTML = upcoming.map((e,i) => card(e, i === 0)).join('') || '<p class="empty">Nichts geplant.</p>';
document.getElementById('past').innerHTML = past.map(e => card(e, false)).join('');
if (!past.length) document.getElementById('pastWrap').hidden = true;

document.addEventListener('click', ev => {
  const qb = ev.target.closest('[data-quiz]:not(.opt)'), cb = ev.target.closest('[data-cards]');
  if (qb && !modal.contains(qb)) { ev.preventDefault(); return startQuiz(qb.dataset.quiz, qb.dataset.tk); }
  if (cb && !modal.contains(cb)) { ev.preventDefault(); return startCards(cb.dataset.cards, cb.dataset.tk); }
  const b = ev.target.closest('.exam>button');
  if (b) { const c = b.parentElement; c.classList.toggle('open'); b.setAttribute('aria-expanded', c.classList.contains('open')); }
});
document.addEventListener('change', ev => {
  const c = ev.target; if (!c.dataset || !c.dataset.k) return;
  if (c.checked) store[c.dataset.k] = 1; else delete store[c.dataset.k];
  save();
  document.querySelectorAll('input[data-k]').forEach(x => { if (x.dataset.k === c.dataset.k) { x.checked = c.checked; x.closest('.task').classList.toggle('done', c.checked); } });
});
}
</script>
</body>
</html>
